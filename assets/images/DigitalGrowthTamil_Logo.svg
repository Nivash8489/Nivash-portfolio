<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DigitalGrowthTamil logo</title>
  <desc id="desc">Blue digital growth icon with upward arrow and DigitalGrowthTamil wordmark.</desc>

  <rect width="1200" height="420" fill="white"/>

  <!-- Icon -->
  <g transform="translate(95,65)">
    <path d="M0 35 L0 215 L62 215 L62 78 L112 78 L112 215 L174 215 L174 35 Z"
          fill="none" stroke="#1268D8" stroke-width="22" stroke-linejoin="round"/>
    <path d="M45 185 L103 130 L138 158 L235 55"
          fill="none" stroke="#16A6D8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M202 55 L238 55 L238 91"
          fill="none" stroke="#16A6D8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="25" y="155" width="30" height="60" rx="4" fill="#08A6C9"/>
    <rect x="75" y="125" width="30" height="90" rx="4" fill="#10B59B"/>
    <rect x="125" y="95" width="30" height="120" rx="4" fill="#22B76F"/>
  </g>

  <!-- Wordmark -->
  <text x="365" y="205"
        font-family="Arial, Helvetica, sans-serif"
        font-size="78"
        font-weight="700"
        letter-spacing="-2">
    <tspan fill="#102B52">DigitalGrowth</tspan><tspan fill="#1687E8">Tamil</tspan>
  </text>

  <!-- Tagline -->
  <text x="370" y="260"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="500"
        letter-spacing="5"
        fill="#29425E">LEARN  |  GROW  |  BUILD YOUR FUTURE</text>

  <!-- Tamil tagline -->
  <text x="370" y="305"
        font-family="Noto Sans Tamil, Nirmala UI, Latha, Arial, sans-serif"
        font-size="25"
        fill="#29425E">கற்றுக் கொள்  |  வளர  |  உங்கள் எதிர்காலத்தை உருவாக்கு</text>
</svg>