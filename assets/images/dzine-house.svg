  <text x="180" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#33251d">VIEW PROJECT →</text>

  <rect x="75" y="650" width="335" height="45" rx="22" fill="#ffffff" opacity=".12"/>
