  <rect x="800" y="145" width="140" height="105" fill="#34291f"/>
  <path d="M810 235 L850 185 L875 215 L900 170 L930 235Z" fill="#d4b48d"/>
  <path d="M810 235 L850 200 L870 220 L900 190 L930 235Z" fill="#b38a60"/>

