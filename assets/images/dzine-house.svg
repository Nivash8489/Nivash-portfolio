<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Dzine House project thumbnail</title>
  <desc id="desc">Warm premium interior design project graphic featuring a modern living room and Dzine House branding.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#211b17"/>
      <stop offset=".55" stop-color="#5a4432"/>
      <stop offset="1" stop-color="#c8a983"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7655"/>
      <stop offset="1" stop-color="#4b3627"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="750" rx="28" fill="#1d1713"/>
  <rect x="0" y="0" width="1200" height="535" fill="url(#wall)"/>
  <rect x="0" y="535" width="1200" height="215" fill="url(#floor)"/>

  <!-- architectural panels -->
  <rect x="690" y="70" width="390" height="430" fill="#70533a" opacity=".75"/>
  <g opacity=".22" stroke="#ead1ad" stroke-width="4">
