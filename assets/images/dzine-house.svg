  <text x="75" y="285" font-family="Arial, sans-serif" font-size="20" letter-spacing="5" font-weight="700" fill="#f1d0a2">THOUGHTFUL SPACES. BETTER LIVING.</text>
  <text x="75" y="345" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Dzine House</text>
