  </g>
  <rect x="1050" y="110" width="95" height="390" fill="#e7d6bd" opacity=".72"/>
  <rect x="1070" y="110" width="55" height="390" fill="#f5eadb" opacity=".8"/>

  <!-- pendant lights -->
